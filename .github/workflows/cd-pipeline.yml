name: Foo App CD Pipeline


on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Check condition and skip actions
        run: |
          if bash check_deploy.sh; then
            echo "Deploy condition is true, skipping subsequent jobs"
            echo "::set-output name=skip-deploy::true"
          else
            echo "Deploy condition is false, proceeding with the CD pipeline"
            echo "::set-output name=skip-deploy::false"
          fi


  cd-pipeline:
    needs: check-deploy
    if: needs.check-deploy.outputs.skip-deploy != 'true'
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout code
        uses: actions/checkout@v3
      - name: APT update
        run: sudo apt update

# Install (awscli, terraform, ansible, docker, python)
      - name: Install python
        run: sudo apt install python3
      - name: Install awscli
        run: sudo apt install awscli
      - name: Install terraform
        run: |
          terraform_binary_url="https://releases.hashicorp.com/terraform/1.3.9/terraform_1.3.9_linux_$(dpkg --print-architecture).zip"
          curl "$terraform_binary_url" > /tmp/terraform.zip
          unzip /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin
      - name: Install ansible
        run: |
          sudo apt install software-properties-common
          sudo add-apt-repository --yes --update ppa:ansible/ansible
          sudo apt install ansible -y
      - name: Install Docker
        run: |
          sudo apt-get install \
          ca-certificates \
          curl \
          gnupg \
          lsb-release -y
          sudo mkdir -m 0755 -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg


# Copy AWS Credentials to ~/.aws/credentials 
      - name: AWS Credentials set up
        run: |
          mkdir ~/.aws
          cat misc/aws_credentials > ~/.aws/credentials 

# Copy key pair to ~/.ssh/
      - name: Key pair set up
        run: |
          cd misc 
          mkdir ~/.ssh
          cp key ~/.ssh/key
          cp key.pub ~/.ssh/key.pub
          cd ~/.ssh
          cat key.pub > authorized_keys
          
          

# Terraform 
      - name: Terraform  - ec2 instance create
        run: | 
          cd misc/infra
          terraform init
          yes yes | terraform apply
          bash get_ip.sh

# Ansible
      - name: Ansible - switch off host key check
        run: |
          cd misc/ansible
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: Ansible - Set-up db ec2 docker
        run: |
          cd misc/ansible
          export ANSIBLE_HOST_KEY_CHECKING=False
          cat ../key
          ansible db_servers -m ping -i inventory.yml -u ubuntu --private-key ../key
        # run: |
        #   cd misc/ansible
        #   cat ~/.ssh/key
        #   ansible-playbook db-playbook.yml -i inventory.yml --private-key ~/.ssh/key


      - name: Ansible - Set-up app ec2 dockers
        run:  |
          cd misc/ansible
          ansible-playbook app-playbook.yml -i inventory.yml --private-key ~/.ssh/key
